<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Outer circle — dark ring -->
  <circle cx="60" cy="60" r="56" stroke="#bc8cff" stroke-width="2.5" opacity="0.3"/>

  <!-- Woven threads — horizontal (knowledge streams) -->
  <path d="M20 42 C35 42, 40 35, 55 35 S75 42, 100 42" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <path d="M20 55 C35 55, 40 48, 55 48 S75 55, 100 55" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M20 68 C35 68, 40 61, 55 61 S75 68, 100 68" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <path d="M20 81 C35 81, 40 74, 55 74 S75 81, 100 81" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" opacity="0.35"/>

  <!-- Woven threads — vertical (context connections) -->
  <path d="M38 22 C38 37, 31 42, 31 57 S38 62, 38 98" stroke="#bc8cff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <path d="M55 22 C55 37, 48 42, 48 57 S55 62, 55 98" stroke="#bc8cff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M72 22 C72 37, 65 42, 65 57 S72 62, 72 98" stroke="#bc8cff" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <path d="M89 22 C89 37, 82 42, 82 57 S89 62, 89 98" stroke="#bc8cff" stroke-width="3" stroke-linecap="round" opacity="0.35"/>

  <!-- Center node — the "brain" nexus point -->
  <circle cx="60" cy="60" r="14" fill="#0d1117" stroke="#bc8cff" stroke-width="2.5"/>
  <circle cx="60" cy="60" r="8" fill="#bc8cff" opacity="0.2"/>
  <circle cx="60" cy="60" r="4" fill="#bc8cff" opacity="0.8"/>

  <!-- Corner accent nodes -->
  <circle cx="28" cy="35" r="3" fill="#58a6ff" opacity="0.6"/>
  <circle cx="92" cy="35" r="3" fill="#58a6ff" opacity="0.6"/>
  <circle cx="28" cy="85" r="3" fill="#58a6ff" opacity="0.4"/>
  <circle cx="92" cy="85" r="3" fill="#58a6ff" opacity="0.4"/>

  <!-- Subtle glow on center -->
  <circle cx="60" cy="60" r="20" fill="#bc8cff" opacity="0.05"/>
</svg>
